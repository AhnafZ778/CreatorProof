<?xml version="1.0" encoding="UTF-8"?>
<!-- A14 · The AI pipeline is designed backwards from this requirement: the output must be byte-identical on a re-run. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 372" role="img" aria-label="Evidence packet is canonicalised, hashed, signed and anchored on chain" overflow="visible" width='1600.0' height='372.0'>
  <style><![CDATA[
@font-face {
  font-family: "Geist";
  src: url("../../assets/fonts/GeistVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("../../assets/fonts/GeistMonoVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Space Grotesk";
  src: url("../../assets/fonts/SpaceGroteskVariable.woff2") format("woff2-variations");
  font-weight: 300 700;
}
:root {
  --bg: #05070c;
  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.74);
  --text-3: rgba(255, 255, 255, 0.54);
  --text-4: rgba(255, 255, 255, 0.36);
  --accent: #60a5fa;
  --accent-2: #a5b4fc;
  --pass: #34d399;
  --review: #fbbf24;
  --block: #f87171;
  --copy: #37d4dc;
  --origin: #f07ab7;
  --profile: #ffbd59;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --display: "Space Grotesk", "Geist", sans-serif;
}
svg { background: var(--bg); }
svg text { font-family: var(--sans); fill: var(--text-2); }
.nd { fill: rgba(255, 255, 255, 0.05); stroke: var(--line-strong); stroke-width: 1.4; }
.nd-a { fill: rgba(96, 165, 250, 0.11); stroke: var(--accent); stroke-width: 1.6; }
.nd-copy { fill: rgba(55, 212, 220, 0.1); stroke: var(--copy); stroke-width: 1.6; }
.nd-orig { fill: rgba(240, 122, 183, 0.1); stroke: var(--origin); stroke-width: 1.6; }
.nd-prof { fill: rgba(255, 189, 89, 0.1); stroke: var(--profile); stroke-width: 1.6; }
.nd-pass { fill: rgba(52, 211, 153, 0.1); stroke: var(--pass); stroke-width: 1.6; }
.nd-warn { fill: rgba(251, 191, 36, 0.1); stroke: var(--review); stroke-width: 1.6; }
.nd-bad { fill: rgba(248, 113, 113, 0.1); stroke: var(--block); stroke-width: 1.6; }
.nd-ghost { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; }
.zone { fill: rgba(255, 255, 255, 0.018); stroke: var(--line); stroke-width: 1.1; stroke-dasharray: 7 6; }
.zone-private { fill: rgba(255, 255, 255, 0.028); stroke: var(--line-strong); stroke-width: 1.1; }
.zone-public { fill: rgba(96, 165, 250, 0.055); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 8 6; }
.t-title { font-size: 21px; font-weight: 600; fill: var(--text); }
.t-sub { font-size: 16.5px; fill: var(--text-3); }
.t-body { font-size: 17.5px; fill: var(--text-2); }
.t-lbl { font-family: var(--mono); font-size: 14px; font-weight: 600; fill: var(--text-4); letter-spacing: 1.5px; text-transform: uppercase; }
.t-mono { font-family: var(--mono); font-size: 15px; fill: var(--text-3); }
.t-big { font-family: var(--display); font-size: 30px; font-weight: 500; fill: var(--text); }
.fx-a { fill: var(--accent); }
.fx-copy { fill: var(--copy); }
.fx-orig { fill: var(--origin); }
.fx-prof { fill: var(--profile); }
.fx-pass { fill: var(--pass); }
.fx-warn { fill: var(--review); }
.fx-bad { fill: var(--block); }
.fx-dim { fill: var(--text-4); }
.fx-txt { fill: var(--text); }
.ar { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
.ar-dec { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.ar-sig { fill: none; stroke: var(--accent-2); stroke-width: 1.6; stroke-dasharray: 7 5; }
.ar-pub { fill: none; stroke: #7fb3ff; stroke-width: 3.2; }
.ar-bad { fill: none; stroke: var(--block); stroke-width: 1.8; stroke-dasharray: 5 5; }
.ar-soft { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.rule { stroke: var(--line-strong); stroke-width: 1.2; }
.rule-hot { stroke: #7fb3ff; stroke-width: 2; stroke-dasharray: 10 6; }
.cal circle { fill: #05070c; stroke: var(--accent); stroke-width: 1.8; }
.cal text { font-family: var(--mono); font-size: 16px; font-weight: 700; fill: var(--accent); text-anchor: middle; }
]]></style>
  <defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.2)"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
  <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb3ff"/></marker>
  <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#37d4dc"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f07ab7"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ffbd59"/></marker>
  </defs>
  <rect class="nd-copy" x="4" y="52" width="300" height="150" rx="9"/>
    <text class="t-lbl fx-copy" x="26" y="80">1 · evidence</text>
    <text class="t-title" x="26" y="112">The packet</text>
    <text class="t-sub" x="26" y="142">Three lane findings, coverage,</text>
    <text class="t-sub" x="26" y="164">model bundle id, policy version,</text>
    <text class="t-sub" x="26" y="186">verified region coordinates.</text>

    <rect class="nd" x="332" y="52" width="300" height="150" rx="9"/>
    <text class="t-lbl fx-dim" x="354" y="80">2 · canonical form</text>
    <text class="t-title" x="354" y="112">Deterministic bytes</text>
    <text class="t-sub" x="354" y="142">Sorted keys, fixed number</text>
    <text class="t-sub" x="354" y="164">formatting — the same scan</text>
    <text class="t-sub" x="354" y="186">always serialises identically.</text>

    <rect class="nd" x="660" y="52" width="300" height="150" rx="9"/>
    <text class="t-lbl fx-dim" x="682" y="80">3 · digest</text>
    <text class="t-title" x="682" y="112">SHA-256</text>
    <text class="t-sub" x="682" y="142">32 bytes standing in for the</text>
    <text class="t-sub" x="682" y="164">entire finding. Change one</text>
    <text class="t-sub" x="682" y="186">pixel of reasoning, change it.</text>

    <rect class="nd" x="988" y="52" width="300" height="150" rx="9"/>
    <text class="t-lbl fx-dim" x="1010" y="80">4 · signature</text>
    <text class="t-title" x="1010" y="112">Ed25519</text>
    <text class="t-sub" x="1010" y="142">Binds the finding to the</text>
    <text class="t-sub" x="1010" y="164">issuing key, so authorship</text>
    <text class="t-sub" x="1010" y="186">is provable off-chain.</text>

    <rect class="nd-a" x="1316" y="52" width="280" height="150" rx="9"/>
    <text class="t-lbl fx-a" x="1338" y="80">5 · anchor</text>
    <text class="t-title" x="1338" y="112">Public chain</text>
    <text class="t-sub" x="1338" y="142">The digest is committed on</text>
    <text class="t-sub" x="1338" y="164">Base via EAS. Nothing about</text>
    <text class="t-sub" x="1338" y="186">the image ever leaves.</text>

    <path class="ar" d="M 308 127 L 326 127" marker-end="url(#a1)"/>
    <path class="ar" d="M 636 127 L 654 127" marker-end="url(#a1)"/>
    <path class="ar" d="M 964 127 L 982 127" marker-end="url(#a3)"/>
    <path class="ar-pub" d="M 1292 127 L 1310 127" marker-end="url(#a4)"/>

    <rect class="nd-pass" x="4" y="230" width="1010" height="128" rx="9"/>
    <text class="t-lbl fx-pass" x="26" y="258">why determinism is an AI requirement, not a blockchain one</text>
    <text class="t-body" x="26" y="292">A model that returns a slightly different phrasing or ordering on a re-run cannot be hashed, cannot be signed,</text>
    <text class="t-body" x="26" y="316">and therefore cannot be evidence. Every choice in this pack — fixed enums instead of free text, an evidence</text>
    <text class="t-body" x="26" y="340">index instead of a generated sentence — exists so the output is byte-stable.</text>

    <rect class="nd-a" x="1042" y="230" width="554" height="128" rx="9"/>
    <text class="t-lbl fx-a" x="1064" y="258">the pair of documents</text>
    <text class="t-body" x="1064" y="292">This is the seam between the two packs. The AI</text>
    <text class="t-body" x="1064" y="316">side produces a deterministic finding; the blockchain</text>
    <text class="t-body" x="1064" y="340">side makes it undeniable. Sheet B3 continues here.</text>

    <g class="cal"><circle cx="608" cy="74" r="17"/><text x="608" y="80">1</text></g>
    <g class="cal"><circle cx="936" cy="74" r="17"/><text x="936" y="80">2</text></g>
    <g class="cal"><circle cx="1568" cy="74" r="17"/><text x="1568" y="80">3</text></g>
    <g class="cal"><circle cx="986" cy="252" r="17"/><text x="986" y="258">4</text></g>
</svg>
