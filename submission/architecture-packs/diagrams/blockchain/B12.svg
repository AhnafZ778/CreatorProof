<?xml version="1.0" encoding="UTF-8"?>
<!-- B12 · Cost lives on layer 2; the security guarantee lives on layer 1. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 268" role="img" aria-label="Settlement stack from CreatorProof through Base to Ethereum layer 1" overflow="visible" width='1600.0' height='268.0'>
  <style><![CDATA[
@font-face {
  font-family: "Geist";
  src: url("../../assets/fonts/GeistVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("../../assets/fonts/GeistMonoVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Space Grotesk";
  src: url("../../assets/fonts/SpaceGroteskVariable.woff2") format("woff2-variations");
  font-weight: 300 700;
}
:root {
  --bg: #05070c;
  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.74);
  --text-3: rgba(255, 255, 255, 0.54);
  --text-4: rgba(255, 255, 255, 0.36);
  --accent: #60a5fa;
  --accent-2: #a5b4fc;
  --pass: #34d399;
  --review: #fbbf24;
  --block: #f87171;
  --copy: #37d4dc;
  --origin: #f07ab7;
  --profile: #ffbd59;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --display: "Space Grotesk", "Geist", sans-serif;
}
svg { background: var(--bg); }
svg text { font-family: var(--sans); fill: var(--text-2); }
.nd { fill: rgba(255, 255, 255, 0.05); stroke: var(--line-strong); stroke-width: 1.4; }
.nd-a { fill: rgba(96, 165, 250, 0.11); stroke: var(--accent); stroke-width: 1.6; }
.nd-copy { fill: rgba(55, 212, 220, 0.1); stroke: var(--copy); stroke-width: 1.6; }
.nd-orig { fill: rgba(240, 122, 183, 0.1); stroke: var(--origin); stroke-width: 1.6; }
.nd-prof { fill: rgba(255, 189, 89, 0.1); stroke: var(--profile); stroke-width: 1.6; }
.nd-pass { fill: rgba(52, 211, 153, 0.1); stroke: var(--pass); stroke-width: 1.6; }
.nd-warn { fill: rgba(251, 191, 36, 0.1); stroke: var(--review); stroke-width: 1.6; }
.nd-bad { fill: rgba(248, 113, 113, 0.1); stroke: var(--block); stroke-width: 1.6; }
.nd-ghost { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; }
.zone { fill: rgba(255, 255, 255, 0.018); stroke: var(--line); stroke-width: 1.1; stroke-dasharray: 7 6; }
.zone-private { fill: rgba(255, 255, 255, 0.028); stroke: var(--line-strong); stroke-width: 1.1; }
.zone-public { fill: rgba(96, 165, 250, 0.055); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 8 6; }
.t-title { font-size: 21px; font-weight: 600; fill: var(--text); }
.t-sub { font-size: 16.5px; fill: var(--text-3); }
.t-body { font-size: 17.5px; fill: var(--text-2); }
.t-lbl { font-family: var(--mono); font-size: 14px; font-weight: 600; fill: var(--text-4); letter-spacing: 1.5px; text-transform: uppercase; }
.t-mono { font-family: var(--mono); font-size: 15px; fill: var(--text-3); }
.t-big { font-family: var(--display); font-size: 30px; font-weight: 500; fill: var(--text); }
.fx-a { fill: var(--accent); }
.fx-copy { fill: var(--copy); }
.fx-orig { fill: var(--origin); }
.fx-prof { fill: var(--profile); }
.fx-pass { fill: var(--pass); }
.fx-warn { fill: var(--review); }
.fx-bad { fill: var(--block); }
.fx-dim { fill: var(--text-4); }
.fx-txt { fill: var(--text); }
.ar { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
.ar-dec { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.ar-sig { fill: none; stroke: var(--accent-2); stroke-width: 1.6; stroke-dasharray: 7 5; }
.ar-pub { fill: none; stroke: #7fb3ff; stroke-width: 3.2; }
.ar-bad { fill: none; stroke: var(--block); stroke-width: 1.8; stroke-dasharray: 5 5; }
.ar-soft { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.rule { stroke: var(--line-strong); stroke-width: 1.2; }
.rule-hot { stroke: #7fb3ff; stroke-width: 2; stroke-dasharray: 10 6; }
.cal circle { fill: #05070c; stroke: var(--accent); stroke-width: 1.8; }
.cal text { font-family: var(--mono); font-size: 16px; font-weight: 700; fill: var(--accent); text-anchor: middle; }
]]></style>
  <defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.2)"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
  <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb3ff"/></marker>
  <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect class="nd" x="16" y="40" width="300" height="94" rx="9"/>
    <text class="t-title" x="38" y="74">CreatorProof</text>
    <text class="t-sub" x="38" y="100">submits an attestation</text>
    <text class="t-mono fx-dim" x="38" y="122">one of thousands of writers</text>

    <rect class="nd-a" x="348" y="40" width="440" height="94" rx="9"/>
    <text class="t-lbl fx-a" x="370" y="66">layer 2 · Base (OP Stack)</text>
    <text class="t-title" x="370" y="98">Sequencer orders, batches post to L1</text>
    <text class="t-mono fx-dim" x="370" y="122">anyone can challenge an invalid state root</text>

    <rect class="nd-a" x="820" y="40" width="440" height="94" rx="9"/>
    <text class="t-lbl fx-a" x="842" y="66">layer 1 · Ethereum</text>
    <text class="t-title" x="842" y="98">Proof of stake, ~1M validators’ stake</text>
    <text class="t-mono fx-dim" x="842" y="122">reversal means attacking Ethereum itself</text>

    <rect class="nd-pass" x="1292" y="40" width="292" height="94" rx="9"/>
    <text class="t-lbl fx-pass" x="1314" y="64">result</text>
    <text class="t-title fx-pass" x="1314" y="94">Cheap writes,</text>
    <text class="t-title fx-pass" x="1314" y="118">L1-grade ordering</text>

    <path class="ar-pub" d="M 320 87 L 342 87" marker-end="url(#a4)"/>
    <path class="ar-pub" d="M 792 87 L 814 87" marker-end="url(#a4)"/>
    <path class="ar-pub" d="M 1264 87 L 1286 87" marker-end="url(#a4)"/>

    <rect class="zone" x="16" y="162" width="1568" height="88" rx="9"/>
    <text class="t-lbl fx-a" x="38" y="190">why not a permissioned chain</text>
    <text class="t-body" x="38" y="222">A consortium chain is governed by its members — and in year one that consortium is effectively us.</text>
    <text class="t-body" x="38" y="244">Permissionless settlement is the only version where “we could not have faked this” is a fact rather than a promise.</text>

    <g class="cal"><circle cx="568" cy="24" r="17"/><text x="568" y="30">1</text></g>
    <g class="cal"><circle cx="1040" cy="24" r="17"/><text x="1040" y="30">2</text></g>
    <g class="cal"><circle cx="1560" cy="190" r="17"/><text x="1560" y="196">3</text></g>
</svg>
