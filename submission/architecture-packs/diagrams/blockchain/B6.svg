<?xml version="1.0" encoding="UTF-8"?>
<!-- B6 · The blue path is everything needed to prove one record was in the tree the chain committed to. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="Merkle tree batching thousands of records into a single on-chain checkpoint" overflow="visible" width='1600.0' height='400.0'>
  <style><![CDATA[
@font-face {
  font-family: "Geist";
  src: url("../../assets/fonts/GeistVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("../../assets/fonts/GeistMonoVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Space Grotesk";
  src: url("../../assets/fonts/SpaceGroteskVariable.woff2") format("woff2-variations");
  font-weight: 300 700;
}
:root {
  --bg: #05070c;
  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.74);
  --text-3: rgba(255, 255, 255, 0.54);
  --text-4: rgba(255, 255, 255, 0.36);
  --accent: #60a5fa;
  --accent-2: #a5b4fc;
  --pass: #34d399;
  --review: #fbbf24;
  --block: #f87171;
  --copy: #37d4dc;
  --origin: #f07ab7;
  --profile: #ffbd59;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --display: "Space Grotesk", "Geist", sans-serif;
}
svg { background: var(--bg); }
svg text { font-family: var(--sans); fill: var(--text-2); }
.nd { fill: rgba(255, 255, 255, 0.05); stroke: var(--line-strong); stroke-width: 1.4; }
.nd-a { fill: rgba(96, 165, 250, 0.11); stroke: var(--accent); stroke-width: 1.6; }
.nd-copy { fill: rgba(55, 212, 220, 0.1); stroke: var(--copy); stroke-width: 1.6; }
.nd-orig { fill: rgba(240, 122, 183, 0.1); stroke: var(--origin); stroke-width: 1.6; }
.nd-prof { fill: rgba(255, 189, 89, 0.1); stroke: var(--profile); stroke-width: 1.6; }
.nd-pass { fill: rgba(52, 211, 153, 0.1); stroke: var(--pass); stroke-width: 1.6; }
.nd-warn { fill: rgba(251, 191, 36, 0.1); stroke: var(--review); stroke-width: 1.6; }
.nd-bad { fill: rgba(248, 113, 113, 0.1); stroke: var(--block); stroke-width: 1.6; }
.nd-ghost { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; }
.zone { fill: rgba(255, 255, 255, 0.018); stroke: var(--line); stroke-width: 1.1; stroke-dasharray: 7 6; }
.zone-private { fill: rgba(255, 255, 255, 0.028); stroke: var(--line-strong); stroke-width: 1.1; }
.zone-public { fill: rgba(96, 165, 250, 0.055); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 8 6; }
.t-title { font-size: 21px; font-weight: 600; fill: var(--text); }
.t-sub { font-size: 16.5px; fill: var(--text-3); }
.t-body { font-size: 17.5px; fill: var(--text-2); }
.t-lbl { font-family: var(--mono); font-size: 14px; font-weight: 600; fill: var(--text-4); letter-spacing: 1.5px; text-transform: uppercase; }
.t-mono { font-family: var(--mono); font-size: 15px; fill: var(--text-3); }
.t-big { font-family: var(--display); font-size: 30px; font-weight: 500; fill: var(--text); }
.fx-a { fill: var(--accent); }
.fx-copy { fill: var(--copy); }
.fx-orig { fill: var(--origin); }
.fx-prof { fill: var(--profile); }
.fx-pass { fill: var(--pass); }
.fx-warn { fill: var(--review); }
.fx-bad { fill: var(--block); }
.fx-dim { fill: var(--text-4); }
.fx-txt { fill: var(--text); }
.ar { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
.ar-dec { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.ar-sig { fill: none; stroke: var(--accent-2); stroke-width: 1.6; stroke-dasharray: 7 5; }
.ar-pub { fill: none; stroke: #7fb3ff; stroke-width: 3.2; }
.ar-bad { fill: none; stroke: var(--block); stroke-width: 1.8; stroke-dasharray: 5 5; }
.ar-soft { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.rule { stroke: var(--line-strong); stroke-width: 1.2; }
.rule-hot { stroke: #7fb3ff; stroke-width: 2; stroke-dasharray: 10 6; }
.cal circle { fill: #05070c; stroke: var(--accent); stroke-width: 1.8; }
.cal text { font-family: var(--mono); font-size: 16px; font-weight: 700; fill: var(--accent); text-anchor: middle; }
]]></style>
  <defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.2)"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
  <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb3ff"/></marker>
  <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <!-- leaves -->
    <text class="t-lbl" x="24" y="34">Evidence packets · one leaf each</text>
    <g>
      <rect class="nd" x="24" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="48" y="332">#8801</text>
      <rect class="nd" x="140" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="164" y="332">#8802</text>
      <rect class="nd-a" x="256" y="300" width="104" height="52" rx="6"/><text class="t-mono fx-txt" x="280" y="332">#8803</text>
      <rect class="nd" x="372" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="396" y="332">#8804</text>
      <rect class="nd" x="488" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="512" y="332">#8805</text>
      <rect class="nd" x="604" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="628" y="332">#8806</text>
      <rect class="nd" x="720" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="744" y="332">#8807</text>
      <rect class="nd" x="836" y="300" width="104" height="52" rx="6"/><text class="t-mono" x="860" y="332">#8808</text>
    </g>
    <text class="t-mono fx-dim" x="24" y="378">SHA-256(0x00 ‖ packet)  —  domain-separated leaf hash</text>

    <!-- level 1 -->
    <g>
      <rect class="nd" x="82" y="228" width="104" height="44" rx="6"/>
      <rect class="nd-a" x="314" y="228" width="104" height="44" rx="6"/>
      <rect class="nd" x="546" y="228" width="104" height="44" rx="6"/>
      <rect class="nd" x="778" y="228" width="104" height="44" rx="6"/>
    </g>
    <path class="ar" d="M 76 296 L 118 276"/><path class="ar" d="M 192 296 L 150 276"/>
    <path class="ar-dec" d="M 308 296 L 350 276"/><path class="ar" d="M 424 296 L 382 276"/>
    <path class="ar" d="M 540 296 L 582 276"/><path class="ar" d="M 656 296 L 614 276"/>
    <path class="ar" d="M 772 296 L 814 276"/><path class="ar" d="M 888 296 L 846 276"/>

    <!-- level 2 -->
    <g>
      <rect class="nd-a" x="198" y="156" width="104" height="44" rx="6"/>
      <rect class="nd" x="662" y="156" width="104" height="44" rx="6"/>
    </g>
    <path class="ar-dec" d="M 134 224 L 234 204"/><path class="ar" d="M 366 224 L 266 204"/>
    <path class="ar" d="M 598 224 L 698 204"/><path class="ar" d="M 830 224 L 730 204"/>

    <!-- root -->
    <rect class="nd-a" x="380" y="84" width="204" height="48" rx="7"/>
    <text class="t-lbl fx-a" x="402" y="114">Merkle root</text>
    <path class="ar-dec" d="M 250 152 L 440 136"/><path class="ar" d="M 714 152 L 524 136"/>

    <!-- signed tree head -->
    <rect class="nd" x="644" y="76" width="286" height="64" rx="8"/>
    <text class="t-body" x="666" y="104">Signed tree head</text>
    <text class="t-mono fx-dim" x="666" y="126">Ed25519 over root + size</text>
    <path class="ar-sig" d="M 590 108 L 638 108" marker-end="url(#a3)"/>

    <!-- chain -->
    <rect class="nd-a" x="1000" y="76" width="290" height="64" rx="8"/>
    <text class="t-lbl fx-a" x="1022" y="104">checkpoint attestation</text>
    <text class="t-mono" x="1022" y="126">one tx · Base</text>
    <path class="ar-pub" d="M 936 108 L 994 108" marker-end="url(#a4)"/>

    <!-- economics -->
    <rect class="zone-public" x="1000" y="176" width="580" height="196" rx="10"/>
    <text class="t-lbl fx-a" x="1022" y="206">what this buys</text>
    <text class="t-body" x="1022" y="240">65 536 records committed by one transaction</text>
    <text class="t-body" x="1022" y="268">inclusion proof for any record: 16 hashes</text>
    <text class="t-body" x="1022" y="296">verification cost: microseconds, offline</text>
    <line class="rule" x1="1022" y1="314" x2="1558" y2="314"/>
    <text class="t-big fx-pass" x="1022" y="352">≈ 0.000002 USD</text>
    <text class="t-sub" x="1270" y="352">marginal cost per record</text>

    <!-- inclusion proof callout -->
    <text class="t-mono fx-a" x="24" y="66">highlighted path = the inclusion proof for record #8803</text>

    <g class="cal"><circle cx="238" cy="278" r="17"/><text x="238" y="284">1</text></g>
    <g class="cal"><circle cx="614" cy="70" r="17"/><text x="614" y="76">2</text></g>
    <g class="cal"><circle cx="966" cy="108" r="17"/><text x="966" y="114">3</text></g>
    <g class="cal"><circle cx="1560" cy="206" r="17"/><text x="1560" y="212">4</text></g>
</svg>
