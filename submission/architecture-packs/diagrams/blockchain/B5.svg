<?xml version="1.0" encoding="UTF-8"?>
<!-- B5 · Two standard EAS contracts we did not write, two small governance contracts we did. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 424" role="img" aria-label="The four deployed contracts and the links between them" overflow="visible" width='1600.0' height='424.0'>
  <style><![CDATA[
@font-face {
  font-family: "Geist";
  src: url("../../assets/fonts/GeistVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("../../assets/fonts/GeistMonoVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Space Grotesk";
  src: url("../../assets/fonts/SpaceGroteskVariable.woff2") format("woff2-variations");
  font-weight: 300 700;
}
:root {
  --bg: #05070c;
  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.74);
  --text-3: rgba(255, 255, 255, 0.54);
  --text-4: rgba(255, 255, 255, 0.36);
  --accent: #60a5fa;
  --accent-2: #a5b4fc;
  --pass: #34d399;
  --review: #fbbf24;
  --block: #f87171;
  --copy: #37d4dc;
  --origin: #f07ab7;
  --profile: #ffbd59;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --display: "Space Grotesk", "Geist", sans-serif;
}
svg { background: var(--bg); }
svg text { font-family: var(--sans); fill: var(--text-2); }
.nd { fill: rgba(255, 255, 255, 0.05); stroke: var(--line-strong); stroke-width: 1.4; }
.nd-a { fill: rgba(96, 165, 250, 0.11); stroke: var(--accent); stroke-width: 1.6; }
.nd-copy { fill: rgba(55, 212, 220, 0.1); stroke: var(--copy); stroke-width: 1.6; }
.nd-orig { fill: rgba(240, 122, 183, 0.1); stroke: var(--origin); stroke-width: 1.6; }
.nd-prof { fill: rgba(255, 189, 89, 0.1); stroke: var(--profile); stroke-width: 1.6; }
.nd-pass { fill: rgba(52, 211, 153, 0.1); stroke: var(--pass); stroke-width: 1.6; }
.nd-warn { fill: rgba(251, 191, 36, 0.1); stroke: var(--review); stroke-width: 1.6; }
.nd-bad { fill: rgba(248, 113, 113, 0.1); stroke: var(--block); stroke-width: 1.6; }
.nd-ghost { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; }
.zone { fill: rgba(255, 255, 255, 0.018); stroke: var(--line); stroke-width: 1.1; stroke-dasharray: 7 6; }
.zone-private { fill: rgba(255, 255, 255, 0.028); stroke: var(--line-strong); stroke-width: 1.1; }
.zone-public { fill: rgba(96, 165, 250, 0.055); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 8 6; }
.t-title { font-size: 21px; font-weight: 600; fill: var(--text); }
.t-sub { font-size: 16.5px; fill: var(--text-3); }
.t-body { font-size: 17.5px; fill: var(--text-2); }
.t-lbl { font-family: var(--mono); font-size: 14px; font-weight: 600; fill: var(--text-4); letter-spacing: 1.5px; text-transform: uppercase; }
.t-mono { font-family: var(--mono); font-size: 15px; fill: var(--text-3); }
.t-big { font-family: var(--display); font-size: 30px; font-weight: 500; fill: var(--text); }
.fx-a { fill: var(--accent); }
.fx-copy { fill: var(--copy); }
.fx-orig { fill: var(--origin); }
.fx-prof { fill: var(--profile); }
.fx-pass { fill: var(--pass); }
.fx-warn { fill: var(--review); }
.fx-bad { fill: var(--block); }
.fx-dim { fill: var(--text-4); }
.fx-txt { fill: var(--text); }
.ar { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
.ar-dec { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.ar-sig { fill: none; stroke: var(--accent-2); stroke-width: 1.6; stroke-dasharray: 7 5; }
.ar-pub { fill: none; stroke: #7fb3ff; stroke-width: 3.2; }
.ar-bad { fill: none; stroke: var(--block); stroke-width: 1.8; stroke-dasharray: 5 5; }
.ar-soft { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.rule { stroke: var(--line-strong); stroke-width: 1.2; }
.rule-hot { stroke: #7fb3ff; stroke-width: 2; stroke-dasharray: 10 6; }
.cal circle { fill: #05070c; stroke: var(--accent); stroke-width: 1.8; }
.cal text { font-family: var(--mono); font-size: 16px; font-weight: 700; fill: var(--accent); text-anchor: middle; }
]]></style>
  <defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.2)"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
  <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb3ff"/></marker>
  <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <!-- schema registry -->
    <rect class="nd" x="24" y="60" width="316" height="188" rx="9"/>
    <text class="t-lbl fx-dim" x="46" y="88">standard · EAS</text>
    <text class="t-title" x="46" y="118">SchemaRegistry</text>
    <line class="rule" x1="24" y1="132" x2="340" y2="132"/>
    <text class="t-mono" x="46" y="160">register(schema)</text>
    <text class="t-sub" x="46" y="188">declares the shape of each</text>
    <text class="t-sub" x="46" y="210">record type, once, publicly</text>
    <text class="t-mono fx-dim" x="46" y="236">0x42…0020</text>

    <!-- three schemas -->
    <rect class="nd-a" x="24" y="272" width="316" height="128" rx="9"/>
    <text class="t-lbl fx-a" x="46" y="298">three registered schemas</text>
    <text class="t-mono fx-txt" x="46" y="326">bytes32 packetHash</text>
    <text class="t-mono fx-txt" x="46" y="352">bytes32 checkpointHash</text>
    <text class="t-mono fx-txt" x="46" y="378">bytes32 coAttestationHash</text>

    <path class="ar" d="M 182 252 L 182 266" marker-end="url(#a1)"/>

    <!-- EAS -->
    <rect class="nd-a" x="404" y="60" width="404" height="340" rx="9"/>
    <text class="t-lbl fx-a" x="426" y="88">standard · EAS core</text>
    <text class="t-title" x="426" y="118">EAS</text>
    <line class="rule" x1="404" y1="132" x2="808" y2="132"/>
    <text class="t-mono fx-txt" x="426" y="160">attest(request) → uid</text>
    <text class="t-mono fx-txt" x="426" y="188">getAttestation(uid)</text>
    <text class="t-mono fx-txt" x="426" y="216">isAttestationValid(uid)</text>
    <text class="t-mono fx-txt" x="426" y="244">revoke(uid)</text>
    <line class="rule" x1="404" y1="266" x2="808" y2="266"/>
    <text class="t-sub" x="426" y="294">Emits Attested(uid, attester, schema).</text>
    <text class="t-sub" x="426" y="318">Any explorer or independent client can</text>
    <text class="t-sub" x="426" y="342">read it without our software.</text>
    <text class="t-mono fx-dim" x="426" y="378">0x42…0021 · Base</text>

    <path class="ar" d="M 344 178 L 398 178" marker-end="url(#a1)"/>
    <path class="ar-sig" d="M 344 320 C 370 320 380 300 398 288" marker-end="url(#a3)"/>

    <!-- member registry -->
    <rect class="nd" x="872" y="60" width="352" height="188" rx="9"/>
    <text class="t-lbl fx-dim" x="894" y="88">ours · governance</text>
    <text class="t-title" x="894" y="118">MemberRegistry</text>
    <line class="rule" x1="872" y1="132" x2="1224" y2="132"/>
    <text class="t-mono" x="894" y="160">enroll · suspend · offboard</text>
    <text class="t-sub" x="894" y="188">seven roles, three statuses,</text>
    <text class="t-sub" x="894" y="210">two-step governor transfer</text>
    <text class="t-mono fx-dim" x="894" y="236">standing regulator seat</text>

    <!-- clearance receipt -->
    <rect class="nd-pass" x="872" y="272" width="352" height="128" rx="9"/>
    <text class="t-lbl fx-pass" x="894" y="298">ours · ERC-5192 soulbound</text>
    <text class="t-title fx-pass" x="894" y="328">ClearanceReceipt</text>
    <text class="t-mono" x="894" y="356">issue(holder, packetHash, uid)</text>
    <text class="t-sub" x="894" y="382">locked() always true — never transferable</text>

    <path class="ar-dec" d="M 1188 252 L 1188 266" marker-end="url(#a2)"/>
    <text class="t-mono fx-a" x="894" y="266">issuance gated by membership</text>

    <path class="ar-sig" d="M 866 330 L 812 330" marker-end="url(#a3)"/>

    <!-- verifier -->
    <rect class="nd" x="1288" y="60" width="288" height="188" rx="9"/>
    <text class="t-lbl fx-dim" x="1310" y="88">anyone</text>
    <text class="t-title" x="1310" y="118">Independent</text>
    <text class="t-title" x="1310" y="146">verifier</text>
    <text class="t-sub" x="1310" y="176">block explorer, EAS scan,</text>
    <text class="t-sub" x="1310" y="198">or a plain RPC call</text>
    <text class="t-mono fx-pass" x="1310" y="228">no CreatorProof code</text>

    <path class="ar-pub" d="M 1230 154 L 1282 154" marker-end="url(#a4)"/>

    <g class="cal"><circle cx="182" cy="264" r="17"/><text x="182" y="270">1</text></g>
    <g class="cal"><circle cx="374" cy="178" r="17"/><text x="374" y="184">2</text></g>
    <g class="cal"><circle cx="1048" cy="42" r="17"/><text x="1048" y="48">3</text></g>
    <g class="cal"><circle cx="840" cy="330" r="17"/><text x="840" y="336">4</text></g>
    <g class="cal"><circle cx="1256" cy="154" r="17"/><text x="1256" y="160">5</text></g>
</svg>
