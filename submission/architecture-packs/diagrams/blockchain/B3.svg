<?xml version="1.0" encoding="UTF-8"?>
<!-- B3 · Stages 1–6 are reproducible by any holder of the packet. Stage 7 is the only step that cannot be undone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="Seven stage pipeline from image upload to on-chain attestation" overflow="visible" width='1600.0' height='400.0'>
  <style><![CDATA[
@font-face {
  font-family: "Geist";
  src: url("../../assets/fonts/GeistVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("../../assets/fonts/GeistMonoVariable.woff2") format("woff2-variations");
  font-weight: 100 900;
}
@font-face {
  font-family: "Space Grotesk";
  src: url("../../assets/fonts/SpaceGroteskVariable.woff2") format("woff2-variations");
  font-weight: 300 700;
}
:root {
  --bg: #05070c;
  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.74);
  --text-3: rgba(255, 255, 255, 0.54);
  --text-4: rgba(255, 255, 255, 0.36);
  --accent: #60a5fa;
  --accent-2: #a5b4fc;
  --pass: #34d399;
  --review: #fbbf24;
  --block: #f87171;
  --copy: #37d4dc;
  --origin: #f07ab7;
  --profile: #ffbd59;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --display: "Space Grotesk", "Geist", sans-serif;
}
svg { background: var(--bg); }
svg text { font-family: var(--sans); fill: var(--text-2); }
.nd { fill: rgba(255, 255, 255, 0.05); stroke: var(--line-strong); stroke-width: 1.4; }
.nd-a { fill: rgba(96, 165, 250, 0.11); stroke: var(--accent); stroke-width: 1.6; }
.nd-copy { fill: rgba(55, 212, 220, 0.1); stroke: var(--copy); stroke-width: 1.6; }
.nd-orig { fill: rgba(240, 122, 183, 0.1); stroke: var(--origin); stroke-width: 1.6; }
.nd-prof { fill: rgba(255, 189, 89, 0.1); stroke: var(--profile); stroke-width: 1.6; }
.nd-pass { fill: rgba(52, 211, 153, 0.1); stroke: var(--pass); stroke-width: 1.6; }
.nd-warn { fill: rgba(251, 191, 36, 0.1); stroke: var(--review); stroke-width: 1.6; }
.nd-bad { fill: rgba(248, 113, 113, 0.1); stroke: var(--block); stroke-width: 1.6; }
.nd-ghost { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; }
.zone { fill: rgba(255, 255, 255, 0.018); stroke: var(--line); stroke-width: 1.1; stroke-dasharray: 7 6; }
.zone-private { fill: rgba(255, 255, 255, 0.028); stroke: var(--line-strong); stroke-width: 1.1; }
.zone-public { fill: rgba(96, 165, 250, 0.055); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 8 6; }
.t-title { font-size: 21px; font-weight: 600; fill: var(--text); }
.t-sub { font-size: 16.5px; fill: var(--text-3); }
.t-body { font-size: 17.5px; fill: var(--text-2); }
.t-lbl { font-family: var(--mono); font-size: 14px; font-weight: 600; fill: var(--text-4); letter-spacing: 1.5px; text-transform: uppercase; }
.t-mono { font-family: var(--mono); font-size: 15px; fill: var(--text-3); }
.t-big { font-family: var(--display); font-size: 30px; font-weight: 500; fill: var(--text); }
.fx-a { fill: var(--accent); }
.fx-copy { fill: var(--copy); }
.fx-orig { fill: var(--origin); }
.fx-prof { fill: var(--profile); }
.fx-pass { fill: var(--pass); }
.fx-warn { fill: var(--review); }
.fx-bad { fill: var(--block); }
.fx-dim { fill: var(--text-4); }
.fx-txt { fill: var(--text); }
.ar { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
.ar-dec { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.ar-sig { fill: none; stroke: var(--accent-2); stroke-width: 1.6; stroke-dasharray: 7 5; }
.ar-pub { fill: none; stroke: #7fb3ff; stroke-width: 3.2; }
.ar-bad { fill: none; stroke: var(--block); stroke-width: 1.8; stroke-dasharray: 5 5; }
.ar-soft { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.rule { stroke: var(--line-strong); stroke-width: 1.2; }
.rule-hot { stroke: #7fb3ff; stroke-width: 2; stroke-dasharray: 10 6; }
.cal circle { fill: #05070c; stroke: var(--accent); stroke-width: 1.8; }
.cal text { font-family: var(--mono); font-size: 16px; font-weight: 700; fill: var(--accent); text-anchor: middle; }
]]></style>
  <defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.2)"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
  <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb3ff"/></marker>
  <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect class="zone-private" x="6" y="40" width="1046" height="270" rx="12"/>
    <text class="t-lbl" x="26" y="30">Private · tenant-isolated, row-level security</text>
    <rect class="zone-public" x="1072" y="40" width="522" height="270" rx="12"/>
    <text class="t-lbl fx-a" x="1092" y="30">Public · irreversible</text>

    <!-- stage boxes, evenly pitched so every gap can carry a visible arrow -->
    <g>
      <rect class="nd" x="30" y="72" width="172" height="112" rx="9"/>
      <text class="t-lbl fx-dim" x="48" y="100">stage 01</text>
      <text class="t-title" x="48" y="130">Evidence</text>
      <text class="t-sub" x="48" y="152">three AI lanes</text>
      <text class="t-sub" x="48" y="172">emit findings</text>

      <rect class="nd" x="238" y="72" width="172" height="112" rx="9"/>
      <text class="t-lbl fx-dim" x="256" y="100">stage 02</text>
      <text class="t-title" x="256" y="130">Packet</text>
      <text class="t-sub" x="256" y="152">findings, policy</text>
      <text class="t-sub" x="256" y="172">and scope sealed</text>

      <rect class="nd-a" x="446" y="72" width="172" height="112" rx="9"/>
      <text class="t-lbl fx-a" x="464" y="100">stage 03</text>
      <text class="t-title" x="464" y="130">Canonical</text>
      <text class="t-sub" x="464" y="152">RFC 8785 JCS</text>
      <text class="t-sub" x="464" y="172">one byte layout</text>

      <rect class="nd-a" x="654" y="72" width="172" height="112" rx="9"/>
      <text class="t-lbl fx-a" x="672" y="100">stage 04</text>
      <text class="t-title" x="672" y="130">Digest</text>
      <text class="t-mono fx-txt" x="672" y="154">SHA-256</text>
      <text class="t-sub" x="672" y="174">→ 32 bytes</text>

      <rect class="nd-a" x="862" y="72" width="172" height="112" rx="9"/>
      <text class="t-lbl fx-a" x="880" y="100">stage 05</text>
      <text class="t-title" x="880" y="130">Statement</text>
      <text class="t-sub" x="880" y="152">Ed25519 over</text>
      <text class="t-sub" x="880" y="172">COSE Sign1</text>
    </g>

    <path class="ar" d="M 206 128 L 230 128" marker-end="url(#a1)"/>
    <path class="ar" d="M 414 128 L 438 128" marker-end="url(#a1)"/>
    <path class="ar" d="M 622 128 L 646 128" marker-end="url(#a1)"/>
    <path class="ar" d="M 830 128 L 854 128" marker-end="url(#a1)"/>

    <!-- transparency log; the signature route leaves the statement box, runs
         along a clear corridor and drops into the top of the log box, so no
         line ever crosses a label -->
    <rect class="nd" x="238" y="228" width="410" height="76" rx="9"/>
    <text class="t-lbl fx-dim" x="256" y="254">stage 06 · transparency log</text>
    <text class="t-body" x="256" y="284">RFC 6962 Merkle tree · signed tree head</text>

    <path class="ar-sig" d="M 948 188 L 948 208 L 443 208 L 443 222" marker-end="url(#a3)"/>

    <!-- chain -->
    <rect class="nd-a" x="1096" y="72" width="470" height="112" rx="9"/>
    <text class="t-lbl fx-a" x="1116" y="100">stage 07 · EAS attestation on Base</text>
    <text class="t-title" x="1116" y="134">attest(schema, bytes32 packetHash)</text>
    <text class="t-mono" x="1116" y="164">confirmed tx → attestation UID → ANCHORED</text>

    <path class="ar-pub" d="M 1038 128 L 1088 128" marker-end="url(#a4)"/>

    <rect class="nd-a" x="1096" y="228" width="470" height="76" rx="9"/>
    <text class="t-lbl fx-a" x="1116" y="254">checkpoint attestation</text>
    <text class="t-body" x="1116" y="284">one transaction commits a whole batch</text>
    <path class="ar-pub" d="M 656 266 L 1088 266" marker-end="url(#a4)"/>

    <!-- footer rules -->
    <text class="t-mono fx-dim" x="30" y="342">deterministic — recomputable by anyone holding the packet</text>
    <line class="rule" x1="30" y1="356" x2="1034" y2="356" stroke-dasharray="4 5"/>
    <text class="t-mono fx-a" x="1096" y="342">irreversible — recomputable by nobody</text>
    <line class="rule-hot" x1="1096" y1="356" x2="1566" y2="356"/>

    <g class="cal"><circle cx="532" cy="54" r="17"/><text x="532" y="60">1</text></g>
    <g class="cal"><circle cx="740" cy="54" r="17"/><text x="740" y="60">2</text></g>
    <g class="cal"><circle cx="948" cy="54" r="17"/><text x="948" y="60">3</text></g>
    <g class="cal"><circle cx="872" cy="266" r="17"/><text x="872" y="272">4</text></g>
    <g class="cal"><circle cx="1063" cy="128" r="17"/><text x="1063" y="134">5</text></g>
</svg>
