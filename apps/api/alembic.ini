[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.16+ uses path_separator for every path-list option. Keep the
# version-path setting for older installations while making current startup
# deterministic and warning-free.
path_separator = os
version_path_separator = os
# The URL is resolved from CREATORPROOF_DATABASE_URL in migrations/env.py so the
# application and the migrations can never disagree about which database is live.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
