[project]
name = "creatorproof-api"
version = "0.9.2"
description = "CreatorProof image-first creative-rights evidence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "imagehash>=4.3,<5",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.11,<5",
  "redis>=6,<8",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
