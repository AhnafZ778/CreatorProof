[project]
name = "creatorproof-api"
version = "0.10.0"
description = "CreatorProof image-first creative-rights evidence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "imagehash>=4.3,<5",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.11,<5",
  "redis>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
# The official container installs this extra so enabling EAS is a configuration
# change, not an untracked runtime pip install.  Keep direct imports explicit:
# proof.py imports web3, eth_abi and eth_account itself.
blockchain = [
  "web3>=7.13,<8",
  "eth-abi>=5.2,<6",
  "eth-account>=0.13.7,<0.14",
]

[dependency-groups]
dev = [
  "anyio>=4.8,<4.12",
  "httpx2>=2.10.0",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
