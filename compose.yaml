services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creatorproof
      POSTGRES_USER: creatorproof
      POSTGRES_PASSWORD: creatorproof-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorproof -d creatorproof"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment: &api_env
      CREATORPROOF_DATABASE_URL: postgresql+psycopg://creatorproof:creatorproof-dev@postgres:5432/creatorproof
      CREATORPROOF_STORAGE_ROOT: /data
      CREATORPROOF_JOB_BACKEND: redis
      CREATORPROOF_REDIS_URL: redis://redis:6379/0
      CREATORPROOF_DEV_API_KEY: ${CREATORPROOF_DEV_API_KEY:-change-me-before-sharing}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - creatorproof_data:/data

  worker:
    build: ./apps/api
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment: *api_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - creatorproof_data:/data

  web:
    build: ./apps/web
    environment:
      CREATORPROOF_API_URL: http://api:8000
      CREATORPROOF_DEV_API_KEY: ${CREATORPROOF_DEV_API_KEY:-change-me-before-sharing}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  creatorproof_data:

